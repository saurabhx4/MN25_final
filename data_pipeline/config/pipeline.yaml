pipeline_version: "mn25-geodata-1.0.0"
study_region: "central_india_sausar_pilot"
aoi: "data_pipeline/config/pilot_aoi.geojson"
target_crs: "EPSG:32644"
analysis_resolution_m: 10
quality:
  max_cloud_fraction: 0.20
  min_valid_pixel_fraction: 0.80
  max_missing_feature_fraction: 0.20
  negative_min_distance_m: 5000
  negative_max_distance_m: 50000
  spatial_block_size_m: 10000
  random_seed: 20260925
sentinel2:
  collection: "sentinel-2-l2a"
  max_cloud_cover: 20
  bands: [B02,B03,B04,B05,B06,B07,B08,B8A,B11,B12,SCL]
  resampling: "bilinear"
  categorical_resampling: "nearest"
  date_start: "2020-01-01"
  date_end: "2026-12-31"
gsi_occurrences:
  catalog_url: "https://www.data.gov.in/catalog/location-manganese-ore-deposits-india-and-its-salient-features"
  resource_url: "https://data.gov.in/resource/location-manganese-ore-deposits-india-and-its-salient-features"
  api_resource_id: ""
  api_key_env: "DATA_GOV_IN_API_KEY"
dem:
  preferred: "copernicus-dem-glo-30"
geology:
  preferred_source: "GSI/NGDR"
  status_if_not_available: "UNAVAILABLE"
structural:
  preferred_source: "GSI/NGDR"
  status_if_not_available: "UNAVAILABLE"
